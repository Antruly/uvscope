name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm --prefix web run check:i18n
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl \
            libuv1-dev zlib1g-dev libssl-dev libsqlite3-dev
      - name: Build patched libuvcpp
        run: bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
      - name: Configure uvscope
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit checks
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end smoke test
        run: bash ./scripts/smoke-test.sh ./build/uvscope 18787 18788

  windows:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            python
      - name: Build libuvcpp and uvscope
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PWD/.deps/libuvcpp/bin:$MINGW_PREFIX/bin:$PATH"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          UVCPP_DIR="$(cygpath -m "$PWD/.deps/libuvcpp")"
          OPENSSL_DIR="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$UVCPP_DIR" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR"
          cmake --build build-mingw -j"$(nproc)"
          # MinGW resolves dependent DLLs at process start. Put the private SDK
          # and toolchain runtimes next to the executable for self-check.
          ls -l build-mingw/uvscope.exe
          cp -f .deps/libuvcpp/bin/*.dll build-mingw/ 2>/dev/null || true
          cp -f .deps/libuvcpp/lib/*.dll build-mingw/ 2>/dev/null || true
          cp -f "$MINGW_PREFIX/bin/"*.dll build-mingw/ 2>/dev/null || true
          find .deps/libuvcpp-src/build-uvscope -name 'libllhttp.dll' -type f -exec cp -f {} build-mingw/ \; 2>/dev/null || true
          echo "--- uvscope dependencies ---"
          ldd build-mingw/uvscope.exe || true
          echo "--- PE import tables ---"
          for f in build-mingw/uvscope.exe build-mingw/libuvcpp.dll; do
            echo "== $f"
            objdump -p "$f" | grep "DLL Name" || true
          done
          echo "--- copied ssl/uv DLLs ---"
          ls -1 build-mingw/libssl* build-mingw/libuv* build-mingw/libcrypto* build-mingw/libsqlite* 2>/dev/null || true
          printf '#include <cstdio>\nint main(){std::printf("hello\\n");return 0;}\n' > build-mingw/hello.cpp
          g++ build-mingw/hello.cpp -o build-mingw/hello.exe
          ./build-mingw/hello.exe || true
          set +e
          ./build-mingw/uvscope.exe --version
          echo "bash version rc=$?"
          powershell.exe -NoProfile -Command "& '.\build-mingw\uvscope.exe' --version; Write-Host ('powershell rc=' + \$LASTEXITCODE)"
          cmd //c "build-mingw\\uvscope.exe --version"
          echo "cmd version rc=$?"
          set -e
          timeout 90 ./build-mingw/uvscope.exe --self-check

      - name: Windows terminal (ConPTY) smoke
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PWD/.deps/libuvcpp/bin:$MINGW_PREFIX/bin:$PATH"
          DATA_DIR="$(mktemp -d)"
          DATA_WIN="$(cygpath -m "$DATA_DIR")"
          PORT=18797
          UVSCOPE_DATA_DIR="$DATA_WIN" ./build-mingw/uvscope.exe --host 127.0.0.1 --port "$PORT" >"$DATA_DIR/daemon.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          PORT="$PORT" DATA_DIR="$DATA_DIR" python - <<'PY'
          import base64
          import http.cookiejar
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = f"http://127.0.0.1:{os.environ['PORT']}"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar))
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with opener.open(base + "/api/health", timeout=1):
                      break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("uvscope did not start")


          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = {"content-type": "application/json"} if data else {}
              request = urllib.request.Request(base + path, data=data,
                                               headers=headers, method=method)
              try:
                  with opener.open(request, timeout=10) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read())


          status, payload = call("POST", "/api/setup/init", {
              "username": "ci-admin", "password": "ci-admin-password"})
          if status != 200:
              raise SystemExit(f"setup failed: {payload}")
          status, payload = call("PUT", "/api/settings", {
              "modules": {"terminal": True}})
          if status != 200:
              raise SystemExit(f"could not enable terminal: {payload}")
          status, payload = call("POST", "/api/terminal/sessions", {
              "name": "ci-conpty", "cols": 100, "rows": 30})
          session = payload.get("session", {}) if isinstance(payload, dict) else {}
          if status != 200 or not session.get("id"):
              raise SystemExit(f"ConPTY session failed: {payload}")
          session_id = session["id"]
          time.sleep(1.0)
          status, payload = call(
              "POST", f"/api/terminal/sessions/{session_id}/input",
              {"data": "Write-Output conpty-ok\r\nexit\r\n"})
          if status != 200:
              raise SystemExit(f"ConPTY input failed: {payload}")
          text = ""
          state = ""
          for _ in range(150):
              status, payload = call(
                  "GET", f"/api/terminal/sessions/{session_id}/output?after=0&limit=200")
              text = b"".join(base64.b64decode(chunk["data"])
                              for chunk in payload.get("chunks", [])).decode(
                                  "utf-8", "replace")
              state = payload.get("session", {}).get("state", "")
              if "conpty-ok" in text and state == "exited":
                  break
              time.sleep(0.1)
          if "conpty-ok" not in text:
              log = open(os.path.join(os.environ["DATA_DIR"], "daemon.log"),
                         encoding="utf-8", errors="replace").read()
              raise SystemExit(f"ConPTY output missing (state={state})\n{text[-800:]}\n{log[-2000:]}")
          print("Windows ConPTY terminal smoke OK")
          PY

  macos:
    name: macOS arm64
    runs-on: macos-14
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install build dependencies
        run: brew install cmake ninja libuv openssl@3 sqlite
      - name: Build patched libuvcpp
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
      - name: Configure and build
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/uvscope --version
          ./build/uvscope --self-check
