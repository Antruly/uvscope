name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm --prefix web run check:i18n
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl \
            libuv1-dev zlib1g-dev libssl-dev libsqlite3-dev
      - name: Build patched libuvcpp
        run: bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
      - name: Configure uvscope
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit checks
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end smoke test
        run: bash ./scripts/smoke-test.sh ./build/uvscope 18787 18788

  windows:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
      - name: Build libuvcpp and uvscope
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PWD/.deps/libuvcpp/bin:$MINGW_PREFIX/bin:$PATH"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          UVCPP_DIR="$(cygpath -m "$PWD/.deps/libuvcpp")"
          OPENSSL_DIR="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$UVCPP_DIR" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR"
          cmake --build build-mingw -j"$(nproc)"
          # MinGW resolves dependent DLLs at process start. Put the private SDK
          # and toolchain runtimes next to the executable for self-check.
          ls -l build-mingw/uvscope.exe
          cp -f .deps/libuvcpp/bin/*.dll build-mingw/ 2>/dev/null || true
          cp -f .deps/libuvcpp/lib/*.dll build-mingw/ 2>/dev/null || true
          cp -f "$MINGW_PREFIX/bin/"*.dll build-mingw/ 2>/dev/null || true
          find .deps/libuvcpp-src/build-uvscope -name 'libllhttp.dll' -type f -exec cp -f {} build-mingw/ \; 2>/dev/null || true
          echo "--- uvscope dependencies ---"
          ldd build-mingw/uvscope.exe || true
          echo "--- PE import tables ---"
          for f in build-mingw/uvscope.exe build-mingw/libuvcpp.dll; do
            echo "== $f"
            objdump -p "$f" | grep "DLL Name" || true
          done
          echo "--- copied ssl/uv DLLs ---"
          ls -1 build-mingw/libssl* build-mingw/libuv* build-mingw/libcrypto* build-mingw/libsqlite* 2>/dev/null || true
          printf '#include <cstdio>\nint main(){std::printf("hello\\n");return 0;}\n' > build-mingw/hello.cpp
          g++ build-mingw/hello.cpp -o build-mingw/hello.exe
          ./build-mingw/hello.exe || true
          set +e
          ./build-mingw/uvscope.exe --version
          echo "bash version rc=$?"
          powershell.exe -NoProfile -Command "& '.\build-mingw\uvscope.exe' --version; Write-Host ('powershell rc=' + \$LASTEXITCODE)"
          cmd //c "build-mingw\\uvscope.exe --version"
          echo "cmd version rc=$?"
          set -e
          timeout 90 ./build-mingw/uvscope.exe --self-check

  macos:
    name: macOS arm64
    runs-on: macos-14
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install build dependencies
        run: brew install cmake ninja libuv openssl@3 sqlite
      - name: Build patched libuvcpp
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
      - name: Configure and build
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/uvscope --version
          ./build/uvscope --self-check
