name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl rpm \
            libuv1-dev zlib1g-dev libssl-dev libsqlite3-dev
      - name: Build
        run: |
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp"
          cmake --build build -j"$(nproc)"
          ./build/uvscope --self-check
          bash ./scripts/smoke-test.sh ./build/uvscope 18787 18788
      - name: Package
        run: |
          mkdir -p packages stage
          cmake --install build --prefix "$PWD/stage"
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C stage -czf "packages/uvscope-${VERSION}-linux-${{ matrix.arch }}.tar.gz" .
          cpack --config build/CPackConfig.cmake -G DEB -B packages || true
          cpack --config build/CPackConfig.cmake -G RPM -B packages || true
          ls -lh packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error

  windows:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
      - name: Build and stage
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PWD/.deps/libuvcpp/bin:$MINGW_PREFIX/bin:$PATH"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          UVCPP_DIR="$(cygpath -m "$PWD/.deps/libuvcpp")"
          OPENSSL_DIR="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$UVCPP_DIR" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR"
          cmake --build build-mingw -j"$(nproc)"
          ./build-mingw/uvscope.exe --self-check
          cmake --install build-mingw --prefix "$(cygpath -m "$PWD/stage")"
          mkdir -p stage/bin stage/web
          for dll in libuv.dll libllhttp.dll zlib1.dll libsqlite3-0.dll \
                     libssl-3-x64.dll libcrypto-3-x64.dll libgcc_s_seh-1.dll \
                     libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "$MINGW_PREFIX/bin/$dll" ]; then cp "$MINGW_PREFIX/bin/$dll" stage/bin/; fi
          done
          curl -fsSL https://curl.se/ca/cacert.pem -o stage/bin/cacert.pem
          cp -f "$PWD/web/dist/"* -r stage/web/ 2>/dev/null || true
      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          $name = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path stage\* -DestinationPath "packages\uvscope-$name-mingw-x64.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\uvscope.iss
          Get-ChildItem packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: packages/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Dependencies
        run: brew install cmake ninja libuv openssl@3 sqlite dylibbundler
      - name: Build
        env:
          OPENSSL_ROOT_DIR: ""
          CMAKE_PREFIX_PATH: ""
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/uvscope --self-check
      - name: Bundle and package
        run: |
          mkdir -p packages stage
          cmake --install build --prefix "$PWD/stage"
          dylibbundler -cd -b -x stage/bin/uvscope -d stage/lib -p @executable_path/../lib || true
          codesign --force --deep -s - stage/bin/uvscope || true
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C stage -czf "packages/uvscope-${VERSION}-macos-arm64.tar.gz" .
          ls -lh packages
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: packages/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show assets
        run: find artifacts -type f -maxdepth 3 -printf '%p %k KB\n'
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
