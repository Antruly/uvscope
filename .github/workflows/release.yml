name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm --prefix web run check:i18n
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl rpm \
            libuv1-dev zlib1g-dev libssl-dev libsqlite3-dev
      - name: Build
        run: |
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp"
          cmake --build build -j"$(nproc)"
          ./build/uvscope --self-check
          bash ./scripts/smoke-test.sh ./build/uvscope 18787 18788
      - name: Package
        run: |
          mkdir -p packages stage
          cmake --install build --prefix "$PWD/stage"
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C stage -czf "packages/uvscope-${VERSION}-linux-${{ matrix.arch }}.tar.gz" .
          cpack --config build/CPackConfig.cmake -G DEB -B packages || true
          cpack --config build/CPackConfig.cmake -G RPM -B packages || true
          ls -lh packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            packages/*.tar.gz
            packages/*.deb
            packages/*.rpm
          if-no-files-found: error

  windows:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
      - name: Build and stage
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PWD/.deps/libuvcpp/bin:$MINGW_PREFIX/bin:$PATH"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          UVCPP_DIR="$(cygpath -m "$PWD/.deps/libuvcpp")"
          OPENSSL_DIR="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$UVCPP_DIR" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR"
          cmake --build build-mingw -j"$(nproc)"
          cp -f .deps/libuvcpp/bin/*.dll build-mingw/ 2>/dev/null || true
          cp -f .deps/libuvcpp/lib/*.dll build-mingw/ 2>/dev/null || true
          cp -f "$MINGW_PREFIX/bin/"*.dll build-mingw/ 2>/dev/null || true
          find .deps/libuvcpp-src/build-uvscope -name 'libllhttp.dll' -type f -exec cp -f {} build-mingw/ \; 2>/dev/null || true
          timeout 90 ./build-mingw/uvscope.exe --self-check
          cmake --install build-mingw --prefix "$(cygpath -m "$PWD/stage")"
          mkdir -p stage/bin
          cp -f build-mingw/libllhttp.dll stage/bin/ 2>/dev/null || true
          ldd build-mingw/uvscope.exe | awk '/=>/ {print $3}' | while read -r dep; do
            case "$dep" in
              "$MINGW_PREFIX"/*|"$PWD/build-mingw"/*) cp -f "$dep" stage/bin/ ;;
            esac
          done
          curl -fsSL https://curl.se/ca/cacert.pem -o stage/bin/cacert.pem || \
            cp "$MINGW_PREFIX/ssl/certs/ca-bundle.crt" stage/bin/cacert.pem || true
      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          $name = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path stage\* -DestinationPath "packages\uvscope-$name-mingw-x64.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\uvscope.iss
          Get-ChildItem packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            packages/*.zip
            packages/*.exe
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Dependencies
        run: brew install cmake ninja libuv openssl@3 sqlite
      - name: Build
        env:
          OPENSSL_ROOT_DIR: ""
          CMAKE_PREFIX_PATH: ""
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export CMAKE_PREFIX_PATH="$OPENSSL_ROOT_DIR"
          bash ./scripts/build-libuvcpp.sh .deps/libuvcpp-src .deps/libuvcpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_ROOT="$PWD/.deps/libuvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/uvscope --self-check
      - name: Bundle and package
        run: |
          mkdir -p packages stage
          cmake --install build --prefix "$PWD/stage"
          # macOS 0.8.1 is a source-oriented build: libuvcpp and llhttp are
          # bundled; Homebrew supplies libuv and OpenSSL. Record the linkage for
          # diagnostics and ad-hoc sign the executable.
          otool -L stage/bin/uvscope || true
          codesign --force --deep -s - stage/bin/uvscope || true
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C stage -czf "packages/uvscope-${VERSION}-macos-arm64.tar.gz" .
          ls -lh packages
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            packages/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    # Publish only when every platform job succeeded. `always()` used to publish
    # a partial release even when one platform failed.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Download only the platform packages. `web-dist` is a build input for the
      # platform jobs, not a release asset; downloading every artifact used to
      # leak its JS/CSS into the release.
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64
      - name: Show assets
        run: find artifacts -type f -maxdepth 3 -printf '%p %k KB\n'
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
